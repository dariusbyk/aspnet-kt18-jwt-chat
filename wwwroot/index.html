<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Чат с JWT</title>
    <link rel="stylesheet" href="css/site.css" />
</head>
<body>
    <h1>Чат с JWT</h1>
    <p id="error" class="error"></p>
    <section id="account">
        <h2>Вход</h2>
        <form id="loginForm">
            <p><label for="loginName">Имя пользователя</label><input id="loginName" required minlength="2" maxlength="40" autocomplete="username" /></p>
            <p><label for="loginPassword">Пароль</label><input id="loginPassword" type="password" required minlength="6" maxlength="100" autocomplete="current-password" /></p>
            <button type="submit">Войти</button>
        </form>
        <h2>Регистрация</h2>
        <form id="registerForm">
            <p><label for="registerName">Имя пользователя</label><input id="registerName" required minlength="2" maxlength="40" autocomplete="username" /></p>
            <p><label for="registerPassword">Пароль</label><input id="registerPassword" type="password" required minlength="6" maxlength="100" autocomplete="new-password" /></p>
            <button type="submit">Зарегистрироваться</button>
        </form>
    </section>
    <section id="chat" hidden>
        <p>Вы вошли как <strong id="username"></strong>. <button id="logout" type="button">Выйти</button></p>
        <p id="status"></p>
        <ul id="messages"></ul>
        <form id="chatForm">
            <label for="message">Сообщение</label>
            <input id="message" maxlength="1000" autocomplete="off" required />
            <button id="sendButton" type="submit" disabled>Отправить</button>
        </form>
    </section>
    <script src="lib/signalr.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
